version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai_collections_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiagent
      POSTGRES_PASSWORD: aiagent123
      POSTGRES_DB: ai_collections
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiagent -d ai_collections"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai_collections_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_collections_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aiagent:aiagent123@postgres:5432/ai_collections
      REDIS_URL: redis://redis:6379
      PAYTM_MID: ${PAYTM_MID:-YOUR_TEST_MID}
      PAYTM_MERCHANT_KEY: ${PAYTM_MERCHANT_KEY:-YOUR_TEST_KEY}
      PAYTM_WEBSITE: ${PAYTM_WEBSITE:-WEBSTAGING}
      PAYTM_ENVIRONMENT: ${PAYTM_ENVIRONMENT:-STAGING}
      PAYTM_CALLBACK_URL: ${PAYTM_CALLBACK_URL:-http://localhost:8000/webhooks/paytm}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_key}
      FRONTEND_URL: http://frontend:3000
      DEBUG: "false"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: ai_collections_frontend
    restart: unless-stopped
    depends_on:
      - backend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  backend_data:
  frontend_node_modules:

networks:
  default:
    name: ai_collections_network
